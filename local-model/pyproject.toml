# local-model/pyproject.toml
[tool.poetry]
name = "local-model"
version = "0.1.0"
description = "L4Local Model Interface with llama.cpp backend"
authors = ["opencode"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic = "^2.6.0"
llama-cpp-python = "^0.2.56"
python-multipart = "^0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"