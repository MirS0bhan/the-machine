[package]
name = "compositor"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
wayland-server = "0.31"
# Pure-Rust HarfBuzz shaping port (https://github.com/harfbuzz/harfrust).
harfrust = "0.13.3"
# FreeType still used for glyph rasterization into the framebuffer.
freetype-rs = "0.38"
# Official Wayland protocol extensions (xdg-shell for G17).
wayland-protocols = { version = "0.32", features = ["server"] }

[[bin]]
name = "compositor"
path = "src/main.rs"
