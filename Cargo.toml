[workspace]
resolver = "2"
members = [
    "common",
    "system-daemon",
    "state-store",
    "event-bus",
    "lambda-server",
    "policy-broker",
    "mcp-bus",
    "agent-core",
    "ui-runtime",
    "compositor",
    "fallback-shell",
    "lambda-examples",
    "local-model-daemon",
    "marketplace",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["The Machine Project"]
license = "Proprietary"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
bytes = "1.5"
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
dashmap = "5.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
libc = "0.2"

# For RocksDB (optional, might not use initially)
sled = "0.34"
# For evdev
input-linux = "0.11"

# For Wayland (compositor)
wayland-client = "0.31"
wayland-server = "0.31"
wlroots = "0.17"

# For MCP protocol
mcp-protocol = { path = "common" }
# For event-bus D-Bus adapter (pure Rust, no dbus-monitor)
zbus = { version = "3.15", default-features = false, features = ["tokio"] }
