name: Build & Release Artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install pytest pytest-asyncio pytest-mock build wheel
          pip install -e lambda-server -e policy-broker -e state-store -e event-bus -e ui-engine
          pip install -e local-model --no-deps
          pip install fastapi uvicorn pydantic python-multipart

      - name: Rust tests
        run: make test-rust

      - name: Python tests
        run: make test-python

      - name: Build-script tests
        run: make test-build-scripts

      - name: Verify documentation ↔ code
        run: make verify-docs

  coverage:
    name: Rust coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: llvm-tools-preview

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Generate coverage
        run: |
          mkdir -p build
          cargo llvm-cov --workspace --lcov --output-path build/coverage.lcov
          cargo llvm-cov --workspace --summary-only

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          # Do not name this rust-* — package-release used to glob rust-* as binaries.
          name: coverage-lcov
          path: build/coverage.lcov
          if-no-files-found: error
          retention-days: 30

  build-rust-components:
    name: Rust — ${{ matrix.component }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component:
          - system-daemon
          - mcp-bus
          - policy-broker
          - state-store
          - event-bus
          - lambda-server
          - local-model-daemon
          - marketplace
          - agent-core
          - ui-runtime
          - compositor
          - fallback-shell
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release -p ${{ matrix.component }}

      - name: Upload component binary
        uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.component }}
          path: target/release/${{ matrix.component }}
          if-no-files-found: error
          retention-days: 30

  build-rust-examples:
    name: Rust — lambda-examples
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build example binaries
        run: cargo build --release -p lambda-examples

      - name: Upload example binaries
        uses: actions/upload-artifact@v4
        with:
          name: rust-lambda-examples
          path: |
            target/release/fn-add
            target/release/fn-bad
          if-no-files-found: error
          retention-days: 30

  build-python-components:
    name: Python — ${{ matrix.package }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - lambda-server
          - policy-broker
          - state-store
          - event-bus
          - local-model
          - ui-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel
        run: |
          pip install build wheel
          pip wheel --no-deps -w dist/ ${{ matrix.package }}/

      - name: Upload Python wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.package }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  build-iso:
    name: Bootable ISO
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install ISO build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            busybox-static grub-pc-bin grub-common xorriso linux-image-virtual

      - name: Build release initramfs + ISO
        run: |
          make initramfs-release
          make iso-release KERNEL=/boot/vmlinuz-$(uname -r)

      - name: Upload initramfs
        uses: actions/upload-artifact@v4
        with:
          name: boot-initramfs
          path: build/initramfs.cpio.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: boot-iso
          path: build/the-machine.iso
          if-no-files-found: error
          retention-days: 30

  package-release:
    name: Combined release bundle
    needs:
      - build-rust-components
      - build-rust-examples
      - build-python-components
      - build-iso
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all component artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/in
          merge-multiple: false

      - name: Assemble release directory
        run: |
          set -euo pipefail
          OUT=artifacts/the-machine-release
          bash build/assemble-release.sh artifacts/in "${OUT}"
          python3 build/ci-package-artifacts.py "${OUT}"
          tar -czf artifacts/the-machine-release.tar.gz -C artifacts the-machine-release
          ls -lh artifacts/the-machine-release.tar.gz

      - name: Upload combined release bundle
        uses: actions/upload-artifact@v4
        with:
          name: the-machine-release
          path: |
            artifacts/the-machine-release.tar.gz
            artifacts/the-machine-release/manifest.json
          if-no-files-found: error
          retention-days: 90
