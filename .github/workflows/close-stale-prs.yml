name: Close stale automation PRs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List PRs only (do not close)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: [main]
    paths:
      - .github/workflows/close-stale-prs.yml
    inputs:
      dry_run:
        description: "List PRs only (do not close)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  pull-requests: write
  contents: read

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close all open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          page=1
          closed=0
          while :; do
            resp=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/pulls?state=open&per_page=100&page=${page}")
            count=$(echo "$resp" | jq 'length')
            [[ "$count" -eq 0 ]] && break

            while IFS=$'\t' read -r num branch title; do
              [[ -z "$num" ]] && continue
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "WOULD CLOSE #${num} (${branch}): ${title}"
                continue
              fi
              echo "Closing #${num}: ${title}"
              code=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/pulls/${num}" \
                -d '{"state":"closed"}')
              if [[ "$code" == "200" ]]; then
                closed=$((closed + 1))
              else
                echo "  warning: close #${num} returned HTTP ${code}"
              fi
            done < <(echo "$resp" | jq -r '.[] | "\(.number)\t\(.head.ref)\t\(.title)"')

            [[ "$count" -lt 100 ]] && break
            page=$((page + 1))
          done
          echo "Closed ${closed} PR(s)"
