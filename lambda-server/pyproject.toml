[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lambda-server"
version = "0.1.0"
description = "Lambda Execution Server - Function Registry, Process Isolation, IPC & MCP Control"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Lambda Server Team" },
]
keywords = ["lambda", "serverless", "ipc", "mcp", "function-registry", "capability-based"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]
server = [
    "uvicorn>=0.20.0",
    "fastapi>=0.100.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/the-machine/lambda-server"
Documentation = "https://github.com/the-machine/lambda-server/tree/main/docs"
Repository = "https://github.com/the-machine/lambda-server"
Issues = "https://github.com/the-machine/lambda-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["lambda_server"]
